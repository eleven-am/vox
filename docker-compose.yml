services:
  vox:
    build:
      context: .
      target: vox
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
        ORT_GIT_REF: ${ORT_GIT_REF:-v1.24.0}
    ports:
      - "11435:11435"
    volumes:
      - vox-data:/home/vox/.vox
    environment:
      - VOX_DEVICE=auto
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - DO_NOT_TRACK=1
      - HF_HUB_DISABLE_TELEMETRY=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Lean CPU image: onnxruntime + CT2/ONNX models, no torch. Runs on Linux
  # amd64/arm64 and Apple-Silicon Docker. `docker compose --profile cpu up`.
  vox-cpu:
    build:
      context: .
      args:
        BASE_IMAGE: python:3.12-slim
        VOX_ACCELERATOR: cpu
        VOX_INCLUDE_TORCH: "0"
    ports:
      - "11435:11435"
    volumes:
      - vox-data:/home/vox/.vox
    environment:
      - VOX_DEVICE=cpu
    profiles:
      - cpu

  # CPU image with the torch stack: runs torch models on CPU (slow).
  # `docker compose --profile cpu-torch up`.
  vox-cpu-torch:
    build:
      context: .
      args:
        BASE_IMAGE: python:3.12-slim
        VOX_ACCELERATOR: cpu
        VOX_INCLUDE_TORCH: "1"
    ports:
      - "11435:11435"
    volumes:
      - vox-data:/home/vox/.vox
    environment:
      - VOX_DEVICE=cpu
    profiles:
      - cpu-torch

volumes:
  vox-data:
