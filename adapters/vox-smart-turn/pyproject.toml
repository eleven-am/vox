[project]
name = "vox-smart-turn"
version = "0.1.0"
description = "Pipecat Smart Turn v3 adapter for Vox"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "vox-runtime>=0.2.93",
    "numpy>=1.26.0,<2.4",
]

[tool.vox.adapter]
import-package = "vox_smart_turn"
runtime-policy = "target-runtime"
runtime-names = ["smart-turn"]
adapter-types = ["turn"]

[project.entry-points."vox.adapters"]
smart-turn-v3 = "vox_smart_turn.adapter:SmartTurnV3Adapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_smart_turn"]
