[project]
name = "vox-piper"
version = "0.2.2"
description = "Piper TTS adapter for Vox"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "vox-runtime>=0.2.2",
    "numpy>=1.26.0,<2.4",
]

[tool.vox.adapter]
import-package = "vox_piper"
runtime-policy = "target-runtime"
runtime-names = ["piper"]
adapter-types = ["tts"]

[project.entry-points."vox.adapters"]
piper-tts-onnx = "vox_piper.adapter:PiperAdapter"
piper = "vox_piper.adapter:PiperAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_piper"]
