[project]
name = "vox-neutts"
version = "0.1.1"
description = "NeuTTS Air adapter for Vox"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "vox-runtime>=0.2.2",
    "numpy>=1.26.0,<2.4",
    "soundfile>=0.13.1",
]

[tool.vox.adapter]
import-package = "vox_neutts"
runtime-policy = "target-runtime"
runtime-names = ["neutts"]
adapter-types = ["tts"]

[project.entry-points."vox.adapters"]
neutts-air-tts-torch = "vox_neutts.adapter:NeuTTSAirAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_neutts"]
