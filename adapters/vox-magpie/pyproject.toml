[project]
name = "vox-magpie"
version = "0.1.0"
description = "NVIDIA MagpieTTS adapter for Vox using NeMo-Speech.cpp"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "vox-runtime>=0.2.133",
    "numpy>=1.26.0,<2.4",
]

[tool.vox.adapter]
import-package = "vox_magpie"
runtime-policy = "target-runtime"
runtime-names = ["magpie-native"]
adapter-types = ["tts"]

[project.entry-points."vox.adapters"]
magpie-tts-gguf = "vox_magpie.adapter:MagpieTTSAdapter"
magpie-tts = "vox_magpie.adapter:MagpieTTSAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_magpie"]
