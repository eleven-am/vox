[project]
name = "vox-spark"
version = "0.1.0"
description = "Spark-TTS adapter for Vox"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "vox-runtime>=0.2.2",
    "numpy>=1.26.0,<2.4",
    "soundfile>=0.13.1",
]

[tool.vox.adapter]
import-package = "vox_spark"
runtime-policy = "target-runtime"
runtime-names = ["spark"]
adapter-types = ["tts"]

[project.entry-points."vox.adapters"]
spark-tts-torch = "vox_spark.adapter:SparkTTSAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vox_spark"]
