[project]
name = "vox-runtime"
version = "0.2.97"
description = "Universal local runtime for STT and TTS models"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=16.0",
    "click>=8.1.0",
    "numpy>=1.26.0,<2.4",
    "soundfile>=0.13.1",
    "soxr>=0.5.0",
    "huggingface-hub>=0.34.0,<1.0",
    "httpx>=0.27.0",
    "pydub>=0.25.1",
    "audioop-lts>=0.2.1; python_version>='3.13'",
    "python-multipart>=0.0.18",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "grpcio-reflection>=1.80.0",
    "protobuf>=6.31.1,<7.0",
    "spacy>=3.7.0",
    "lameenc>=1.8.1",
    "opuslib>=3.0.1",
    "aiortc>=1.14.0",
    "pondsocket-common>=0.0.1,<0.1.0",
    "pondsocket>=0.0.7,<0.1.0",
    "pondsocket-asgi>=0.0.1,<0.1.0",
    "onnxruntime>=1.27.0",
    "transformers>=4.57.6,<4.58",
]

[project.scripts]
vox = "vox.cli:cli"

[project.optional-dependencies]
ten-vad = [
    "ten-vad>=1.0.6",
]
ten-turn = [
    "torch>=2.0.0",
    "transformers>=4.45.0",
]
turn-research = [
    "ten-vad>=1.0.6",
    "torch>=2.0.0",
    "transformers>=4.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]

[tool.hatch.build.targets.wheel.force-include]
"src/vox/streaming/assets/silero_vad.onnx" = "vox/streaming/assets/silero_vad.onnx"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
