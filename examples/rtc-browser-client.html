<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vox RTC Browser Client</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      background: Canvas;
      color: CanvasText;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    section {
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 8px;
      padding: 16px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
    }
    input, textarea, button, select {
      font: inherit;
    }
    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      border-radius: 6px;
      background: Canvas;
      color: CanvasText;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    button {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
      border-radius: 6px;
      background: ButtonFace;
      color: ButtonText;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }
    .status {
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 6px;
      padding: 10px;
      min-height: 54px;
    }
    .status span {
      display: block;
      font-size: 12px;
      color: color-mix(in srgb, CanvasText 68%, transparent);
    }
    .status strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
    }
    .timeline {
      display: grid;
      gap: 6px;
      max-height: 220px;
      overflow: auto;
    }
    .timeline div {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: color-mix(in srgb, CanvasText 7%, Canvas);
      font-size: 12px;
    }
    .timeline .warn {
      background: color-mix(in srgb, Mark 28%, Canvas);
      color: MarkText;
    }
    .timeline .danger {
      background: color-mix(in srgb, #d92d20 18%, Canvas);
    }
    pre {
      min-height: 240px;
      max-height: 420px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      border-radius: 6px;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vox RTC Browser Client</h1>

    <section class="grid">
      <label>
        Vox HTTP base
        <input id="httpBase" value="https://vox.horus.maix.ovh">
      </label>
      <label>
        STT model
        <input id="sttModel" value="parakeet-stt-onnx:tdt-0.6b-v3">
      </label>
      <label>
        TTS model
        <input id="ttsModel" value="kokoro-tts-onnx:v1.0">
      </label>
      <label>
        Voice
        <input id="voice" value="af_heart">
      </label>
      <label>
        ICE policy
        <select id="icePolicy">
          <option value="all">All candidates</option>
          <option value="relay">TURN relay only</option>
        </select>
      </label>
    </section>

    <section class="status-grid">
      <div class="status"><span>Peer</span><strong id="peerState">idle</strong></div>
      <div class="status"><span>ICE</span><strong id="iceState">idle</strong></div>
      <div class="status"><span>Playback</span><strong id="playbackState">idle</strong></div>
      <div class="status"><span>Turn</span><strong id="turnState">idle</strong></div>
      <div class="status"><span>Interruptions</span><strong id="interruptCount">0</strong></div>
      <div class="status"><span>False positives</span><strong id="falsePositiveCount">0</strong></div>
    </section>

    <section>
      <div class="actions">
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
      </div>
      <audio id="assistantAudio" autoplay playsinline controls></audio>
    </section>

    <section>
      <label>
        Assistant text
        <textarea id="assistantText">Hello. This is Vox speaking over WebRTC. I am going to keep talking long enough for you to test barge in. Start speaking over this audio from the loudspeaker and watch whether Vox sends interruption detected, audio clear, response cancelled, and interrupted state events.</textarea>
      </label>
      <div class="actions" style="margin-top: 12px;">
        <button id="sendTextBtn" disabled>Send response</button>
        <button id="cancelBtn" disabled>Cancel response</button>
      </div>
    </section>

    <section>
      <div id="timeline" class="timeline"></div>
    </section>

    <section>
      <pre id="log"></pre>
    </section>
  </main>

  <script>
    const httpBaseInput = document.querySelector("#httpBase");
    const sttModelInput = document.querySelector("#sttModel");
    const ttsModelInput = document.querySelector("#ttsModel");
    const voiceInput = document.querySelector("#voice");
    const icePolicyInput = document.querySelector("#icePolicy");
    const connectBtn = document.querySelector("#connectBtn");
    const disconnectBtn = document.querySelector("#disconnectBtn");
    const sendTextBtn = document.querySelector("#sendTextBtn");
    const cancelBtn = document.querySelector("#cancelBtn");
    const assistantText = document.querySelector("#assistantText");
    const assistantAudio = document.querySelector("#assistantAudio");
    const logEl = document.querySelector("#log");
    const timelineEl = document.querySelector("#timeline");
    const peerStateEl = document.querySelector("#peerState");
    const iceStateEl = document.querySelector("#iceState");
    const playbackStateEl = document.querySelector("#playbackState");
    const turnStateEl = document.querySelector("#turnState");
    const interruptCountEl = document.querySelector("#interruptCount");
    const falsePositiveCountEl = document.querySelector("#falsePositiveCount");

    let pc = null;
    let controlWs = null;
    let eventSource = null;
    let mediaToken = null;
    let sessionId = null;
    let micStream = null;
    let remoteStream = null;
    let pendingCandidates = [];
    let interruptions = 0;
    let falsePositives = 0;

    function log(type, payload) {
      const line = `[${new Date().toISOString()}] ${type} ${JSON.stringify(payload)}`;
      logEl.textContent += `${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(el, value) {
      el.textContent = value || "idle";
    }

    function timeline(type, payload = {}) {
      const row = document.createElement("div");
      const important = [
        "interruption.detected",
        "response.audio.clear",
        "response.cancelled",
        "turn.state_changed"
      ];
      if (type === "interruption.false_positive") row.className = "warn";
      if (important.includes(type)) row.className = "danger";
      const at = document.createElement("span");
      at.textContent = new Date().toLocaleTimeString();
      const text = document.createElement("strong");
      const suffix = payload.state
        ? ` ${payload.state}`
        : payload.candidateType
          ? ` ${payload.candidateType}`
          : payload.response_id
            ? ` ${payload.response_id}`
            : "";
      text.textContent = `${type}${suffix}`;
      row.append(at, text);
      timelineEl.prepend(row);
      while (timelineEl.children.length > 80) timelineEl.lastChild.remove();
    }

    function candidateType(candidate) {
      if (!candidate) return "end";
      const text = typeof candidate === "string" ? candidate : candidate.candidate || "";
      const match = text.match(/\styp\s([a-z0-9]+)/i);
      return match ? match[1] : "unknown";
    }

    function countSdpCandidates(sdp) {
      if (!sdp) return 0;
      return sdp.split(/\r?\n/).filter((line) => line.startsWith("a=candidate:")).length;
    }

    async function waitForIceGathering(timeoutMs = 8000) {
      if (!pc || pc.iceGatheringState === "complete") return { completed: true };
      return new Promise((resolve) => {
        const timeout = window.setTimeout(() => {
          cleanup();
          resolve({ completed: false, warning: `ICE gathering timed out after ${timeoutMs}ms` });
        }, timeoutMs);

        function onStateChange() {
          if (pc && pc.iceGatheringState === "complete") {
            cleanup();
            resolve({ completed: true });
          }
        }

        function cleanup() {
          window.clearTimeout(timeout);
          if (pc) pc.removeEventListener("icegatheringstatechange", onStateChange);
        }

        pc.addEventListener("icegatheringstatechange", onStateChange);
      });
    }

    async function attachAssistantAudio() {
      if (!remoteStream) return;
      if (assistantAudio.srcObject !== remoteStream) {
        assistantAudio.srcObject = remoteStream;
      }
      assistantAudio.muted = false;
      await assistantAudio.play().catch(() => {});
    }

    function clearAssistantAudio() {
      assistantAudio.pause();
      assistantAudio.srcObject = null;
      setStatus(playbackStateEl, "cleared");
    }

    function handleWireEvent(event) {
      const type = event.type || "message";
      timeline(type, event);
      if (type === "session.created") setStatus(turnStateEl, "listening");
      if (type === "response.created") {
        setStatus(playbackStateEl, "starting");
        attachAssistantAudio();
      }
      if (type === "response.done") setStatus(playbackStateEl, "done");
      if (type === "response.cancelled") setStatus(playbackStateEl, "cancelled");
      if (type === "response.audio.clear") clearAssistantAudio();
      if (type === "interruption.detected") {
        interruptions += 1;
        setStatus(interruptCountEl, String(interruptions));
      }
      if (type === "interruption.false_positive") {
        falsePositives += 1;
        setStatus(falsePositiveCountEl, String(falsePositives));
        attachAssistantAudio();
      }
      if (type === "turn.state_changed") setStatus(turnStateEl, event.state);
    }

    function wsBase(httpBase) {
      const url = new URL(httpBase);
      url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
      return url.toString().replace(/\/$/, "");
    }

    async function postJson(path, body, token = null) {
      const headers = { "content-type": "application/json" };
      if (token) headers.authorization = `Bearer ${token}`;
      const response = await fetch(`${httpBaseInput.value.replace(/\/$/, "")}${path}`, {
        method: "POST",
        headers,
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        throw new Error(`${response.status} ${await response.text()}`);
      }
      return response.json();
    }

    async function flushCandidates() {
      if (!mediaToken) return;
      const candidates = pendingCandidates;
      pendingCandidates = [];
      for (const candidate of candidates) {
        const type = candidateType(candidate);
        try {
          await postJson(`/v1/rtc/sessions/${sessionId}/candidates`, { candidate }, mediaToken);
        } catch (error) {
          log("candidate.error", { message: error.message, type });
          timeline("candidate.error", { candidateType: type });
        }
      }
    }

    async function connect() {
      connectBtn.disabled = true;
      const session = await postJson("/v1/rtc/sessions", {});
      sessionId = session.session_id;
      log("session", session);
      timeline("session", { session_id: sessionId });

      pc = new RTCPeerConnection({
        iceServers: session.ice_servers,
        iceTransportPolicy: icePolicyInput.value
      });
      pc.ontrack = (event) => {
        remoteStream = event.streams[0];
        assistantAudio.srcObject = remoteStream;
        log("track", { kind: event.track.kind });
        timeline("track", { kind: event.track.kind });
      };
      pc.onicecandidate = async (event) => {
        const candidate = event.candidate ? event.candidate.toJSON() : null;
        const type = candidateType(candidate);
        log("local.ice_candidate", { type, candidate });
        timeline("local.ice_candidate", { candidateType: type });
        if (!mediaToken) {
          pendingCandidates.push(candidate);
          return;
        }
        try {
          await postJson(`/v1/rtc/sessions/${sessionId}/candidates`, { candidate }, mediaToken);
        } catch (error) {
          log("candidate.error", { message: error.message, type });
          timeline("candidate.error", { candidateType: type });
        }
      };
      pc.onconnectionstatechange = () => {
        setStatus(peerStateEl, pc.connectionState);
        log("pc.connectionState", { state: pc.connectionState });
      };
      pc.oniceconnectionstatechange = () => {
        setStatus(iceStateEl, pc.iceConnectionState);
        log("pc.iceConnectionState", { state: pc.iceConnectionState });
      };
      pc.onicegatheringstatechange = () => {
        log("pc.iceGatheringState", {
          state: pc.iceGatheringState,
          localCandidateCount: countSdpCandidates(pc.localDescription && pc.localDescription.sdp)
        });
      };
      pc.onicecandidateerror = (event) => {
        log("local.ice_candidate_error", {
          url: event.url,
          address: event.address,
          port: event.port,
          errorCode: event.errorCode,
          errorText: event.errorText
        });
        timeline("local.ice_candidate_error", { candidateType: event.errorCode || "error" });
      };

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      for (const track of micStream.getAudioTracks()) {
        pc.addTrack(track, micStream);
      }

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      const gatherResult = await waitForIceGathering();
      const localDescription = pc.localDescription;
      if (!localDescription || !localDescription.sdp) {
        throw new Error("Local SDP offer is missing after setLocalDescription");
      }
      log("offer.ready", {
        iceGatheringState: pc.iceGatheringState,
        localCandidateCount: countSdpCandidates(localDescription.sdp),
        warning: gatherResult.warning || null
      });
      timeline("offer.ready", { candidateType: String(countSdpCandidates(localDescription.sdp)) });
      const answer = await postJson(
        `/v1/rtc/sessions/${sessionId}/offer`,
        { type: localDescription.type, sdp: localDescription.sdp },
        session.client_token
      );
      mediaToken = answer.media_token;
      log("answer", { session_id: answer.session_id, type: answer.type, events_url: answer.events_url });
      timeline("answer", { session_id: answer.session_id });
      await pc.setRemoteDescription({ type: answer.type, sdp: answer.sdp });
      await flushCandidates();

      eventSource = new EventSource(`${httpBaseInput.value.replace(/\/$/, "")}${answer.events_url}`);
      eventSource.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        log("sse.message", payload);
        handleWireEvent(payload);
      };
      eventSource.addEventListener("rtc.ice_candidate", async (event) => {
        const payload = JSON.parse(event.data);
        log("sse.ice", payload);
        await pc.addIceCandidate(payload.candidate);
      });
      eventSource.addEventListener("rtc.connection_state", (event) => log("sse.connection", JSON.parse(event.data)));
      eventSource.addEventListener("rtc.ice_connection_state", (event) => log("sse.ice_connection", JSON.parse(event.data)));
      eventSource.addEventListener("close", () => {
        log("sse.close", {});
        timeline("sse.close");
      });

      controlWs = new WebSocket(`${wsBase(httpBaseInput.value)}/v1/rtc/sessions/${sessionId}/control`);
      controlWs.onmessage = (event) => {
        const payload = JSON.parse(event.data);
        log("control", payload);
        handleWireEvent(payload);
      };
      controlWs.onopen = () => {
        controlWs.send(JSON.stringify({
          type: "session.update",
          session: {
            stt_model: sttModelInput.value,
            tts_model: ttsModelInput.value,
            voice: voiceInput.value,
            vad_backend: "silero",
            turn_detector: "livekit",
            turn_policy: {
              allow_interrupt_while_speaking: true,
              partial_interrupts: true,
              dynamic_endpointing: true,
              speaking_interrupt_min_duration_ms: 500,
              speaking_interrupt_min_words: 2
            }
          }
        }));
      };
      controlWs.onclose = (event) => {
        log("control.close", { code: event.code, reason: event.reason });
        timeline("control.close", { code: event.code });
      };

      disconnectBtn.disabled = false;
      sendTextBtn.disabled = false;
      cancelBtn.disabled = false;
    }

    async function disconnect() {
      sendTextBtn.disabled = true;
      cancelBtn.disabled = true;
      disconnectBtn.disabled = true;
      if (eventSource) eventSource.close();
      if (controlWs && controlWs.readyState === WebSocket.OPEN) controlWs.close();
      if (pc) await pc.close();
      if (micStream) micStream.getTracks().forEach((track) => track.stop());
      eventSource = null;
      controlWs = null;
      pc = null;
      micStream = null;
      remoteStream = null;
      mediaToken = null;
      sessionId = null;
      pendingCandidates = [];
      setStatus(peerStateEl, "idle");
      setStatus(iceStateEl, "idle");
      setStatus(playbackStateEl, "idle");
      setStatus(turnStateEl, "idle");
      connectBtn.disabled = false;
    }

    connectBtn.addEventListener("click", () => connect().catch((error) => {
      log("error", { message: error.message });
      connectBtn.disabled = false;
    }));
    disconnectBtn.addEventListener("click", () => disconnect().catch((error) => log("error", { message: error.message })));
    sendTextBtn.addEventListener("click", () => {
      if (!controlWs || controlWs.readyState !== WebSocket.OPEN) return;
      attachAssistantAudio();
      setStatus(playbackStateEl, "requested");
      controlWs.send(JSON.stringify({ type: "response.start" }));
      controlWs.send(JSON.stringify({ type: "response.delta", delta: assistantText.value }));
      controlWs.send(JSON.stringify({ type: "response.commit" }));
    });
    cancelBtn.addEventListener("click", () => {
      if (controlWs && controlWs.readyState === WebSocket.OPEN) {
        controlWs.send(JSON.stringify({ type: "response.cancel" }));
      }
    });
  </script>
</body>
</html>
